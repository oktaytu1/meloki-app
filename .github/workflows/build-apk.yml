name: Meloki APK Bulut Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK'yı Derle ve İndirme Bağlantısı Üret
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Getir
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradlew Yetkisi Ver ve SDK Ayarla
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: APK Derle (assembleDebug)
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Build Logunu Artifact Olarak Sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: android/build_log.txt

      - name: APK Dosyasını Yükle (Artifacts)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Meloki-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Doğrudan İndirme Release'i Oluştur
        uses: softprops/action-gh-release@v2
        if: success() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: latest
          name: "Meloki Son APK (Doğrudan İndir)"
          body: "Sevgilinizle oynamak için indirin ve telefonunuza kurun! Saydam widget, balıkçılık ve yürüyen kedi aktiftir."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
