name: Meloki APK Bulut Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: APK'yı Derle ve İndirme Bağlantısı Üret
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Getir
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradlew Yetkisi Ver ve SDK Ayarla
        run: |
          chmod +x android/gradlew
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties

      - name: APK Derle (assembleDebug)
        id: assemble
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > ../build_log.txt 2>&1 || (echo "### ❌ DERLEME HATASI:" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 80 ../build_log.txt >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && cat ../build_log.txt | tail -n 50 && exit 1)

      - name: APK Dosyasını Yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Meloki-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Doğrudan İndirme Release'i Oluştur
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: latest
          name: "Meloki Son APK (Doğrudan İndir)"
          body: "Sevgilinizle oynamak için indirin ve telefonunuza kurun! Saydam widget, balıkçılık ve yürüyen kedi aktiftir."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
